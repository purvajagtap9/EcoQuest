services:
  mongodb:
    image: mongo:7
    container_name: ecoquest-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: ecoquest-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/ecoquest
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-change-this-dev-only-secret-please-override-in-env-file-32chars}
      JWT_EXPIRATION_MS: 86400000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      STORAGE_PROVIDER: local
      FILE_STORAGE_PATH: /app/uploads
      MAX_UPLOAD_SIZE: 5MB
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEFAULT_GEO_RADIUS_METERS: 500
      SEED_DATA: ${SEED_DATA:-false}
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: ecoquest-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo-data:
  backend-uploads:
