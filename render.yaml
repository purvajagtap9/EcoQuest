services:
  - type: web
    name: ecoquest-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false        # paste your MongoDB Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false        # set to your deployed frontend URL, e.g. https://ecoquest-india.vercel.app
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: FILE_STORAGE_PATH
        value: /app/uploads
      - key: MAX_UPLOAD_SIZE
        value: 5MB
      - key: DEFAULT_GEO_RADIUS_METERS
        value: "500"
